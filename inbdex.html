<!DOCTYPE html>
<html>
<head>
    <title>Local Photo Viewer</title>
    <style>
        body { margin: 0; padding: 20px; background: #f5f5f5; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
        .thumbnail { width: 200px; height: 200px; object-fit: cover; cursor: pointer; border: 2px solid transparent; }
        .thumbnail:hover { border-color: #4285f4; }
        #viewer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; }
        #fullImage { max-width: 90%; max-height: 90%; }
        #close { position: absolute; top: 20px; right: 20px; color: white; font-size: 30px; cursor: pointer; }
    </style>
</head>
<body>
    <input type="file" id="fileInput" webkitdirectory multiple>
    <div class="grid" id="grid"></div>
    
    <div id="viewer">
        <span id="close">&times;</span>
        <img id="fullImage">
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const grid = document.getElementById('grid');
        const viewer = document.getElementById('viewer');
        const fullImage = document.getElementById('fullImage');
        const closeBtn = document.getElementById('close');
        
        fileInput.addEventListener('change', function(e) {
            grid.innerHTML = '';
            Array.from(e.target.files).forEach(file => {
                if (file.type.startsWith('image/')) {
                    const img = document.createElement('img');
                    img.src = URL.createObjectURL(file);
                    img.className = 'thumbnail';
                    img.onclick = () => {
                        fullImage.src = img.src;
                        viewer.style.display = 'flex';
                    };
                    grid.appendChild(img);
                }
            });
        });
        
        closeBtn.onclick = () => viewer.style.display = 'none';
    </script>
</body>
</html>
